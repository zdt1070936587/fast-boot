server:
  port: 18082

spring:
  application:
    name: fastboot-authz-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fastboot}
    username: ${POSTGRES_USER:fastboot}
    password: ${POSTGRES_PASSWORD:fastboot}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:fastboot}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  is-concurrent: true
  is-share: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

fastboot:
  security:
    permit-docs: true
    permit-internal: true
  admin:
    bootstrap: false
