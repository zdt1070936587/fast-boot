server:
  port: 18083

spring:
  application:
    name: fastboot-org-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:15432}/${POSTGRES_DB:fastboot}
    username: ${POSTGRES_USER:dafu}
    password: ${POSTGRES_PASSWORD:123456}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:fastboot}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  is-concurrent: true
  is-share: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

fastboot:
  security:
    permit-docs: true
  admin:
    bootstrap: false
