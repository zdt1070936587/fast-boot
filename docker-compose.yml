services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fastboot
      POSTGRES_USER: fastboot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fastboot}
    ports:
      - "5432:5432"
    volumes:
      - fb_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastboot -d fastboot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-fastboot}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-fastboot}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fb_pg_data:
