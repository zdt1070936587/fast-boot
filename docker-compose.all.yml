# FastBoot 全栈本地参考（按需取消注释）
# 基础数据层：postgres + redis（与 docker-compose.yml 等价，便于一键文档引用）

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fastboot
      POSTGRES_USER: fastboot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fastboot}
    ports:
      - "5432:5432"
    volumes:
      - fb_pg_all_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-fastboot}
    ports:
      - "6379:6379"

