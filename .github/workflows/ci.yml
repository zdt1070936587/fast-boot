name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Trivy fs scan
        if: matrix.java == 21
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0

  spotless:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Spotless check (non-blocking)
        run: mvn -B spotless:check
      - name: Format hint
        if: failure()
        run: echo "Run mvn spotless:apply locally to fix Java formatting (AOSP)."

  ui-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect fastboot-ui
        id: ui
        run: |
          if [ -f fastboot-ui/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.ui.outputs.present == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.ui.outputs.present == 'true'
        with:
          node-version: 20
      - name: pnpm install and build
        if: steps.ui.outputs.present == 'true'
        working-directory: fastboot-ui
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
