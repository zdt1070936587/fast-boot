name: CI

on:
    push:
        branches: [main, master]
    pull_request:

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: 21
                    cache: maven
            - name: Build and test
                run: mvn -B verify
            - name: Trivy fs scan
                uses: aquasecurity/trivy-action@0.28.0
                with:
                    scan-type: fs
                    scan-ref: .
                    severity: CRITICAL,HIGH
                    exit-code: 0
