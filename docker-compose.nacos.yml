# Optional Nacos for experimental microservice discovery.
# Usage: docker compose -f docker-compose.yml -f docker-compose.nacos.yml up -d
services:
    nacos:
        image: nacos/nacos-server:v2.4.3
        environment:
            MODE: standalone
            NACOS_AUTH_ENABLE: "true"
            NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-FastbootNacosTokenSecret0123456789AB}
            NACOS_AUTH_IDENTITY_KEY: nacos
            NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY:-fastboot}
        ports:
            - "8848:8848"
            - "9848:9848"
