spring:
  datasource:
    username: ${POSTGRES_USER:dafu}
    password: ${POSTGRES_PASSWORD:123456}
  data:
    redis:
      # 本机现有 redis 容器 requirepass=qxmof；项目 docker-compose 默认仍是 fastboot
      password: ${REDIS_PASSWORD:qxmof}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

fastboot:
  security:
    permit-docs: true
  admin:
    bootstrap: true
    password: ${FASTBOOT_ADMIN_PASSWORD:admin}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
