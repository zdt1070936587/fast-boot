spring:
    datasource:
        username: ${POSTGRES_USER}
        password: ${POSTGRES_PASSWORD}
    data:
        redis:
            password: ${REDIS_PASSWORD}

management:
    endpoints:
        web:
            exposure:
                include: health
    endpoint:
        health:
            show-details: never

springdoc:
    api-docs:
        enabled: false
    swagger-ui:
        enabled: false

fastboot:
    security:
        permit-docs: false
    admin:
        bootstrap: false
