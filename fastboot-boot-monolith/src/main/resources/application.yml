server:
    port: ${SERVER_PORT:8080}
    forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: fastboot-monolith
  jackson:
    serialization:
      write-dates-as-timestamps: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS:false}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:15432}/${POSTGRES_DB:fastboot}
    username: ${POSTGRES_USER:dafu}
    password: ${POSTGRES_PASSWORD:123456}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: 2
      connection-timeout: 30000
      leak-detection-threshold: 20000
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  is-concurrent: true
  is-share: false

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE:0.1}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

fastboot:
  security:
    permit-docs: false
    permit-internal: false
  admin:
    bootstrap: false
  oauth2:
    enabled: false
  justauth:
    enabled: false
  captcha:
    enabled: false
  passkey:
    enabled: false
    rp-id: localhost
    rp-name: FastBoot

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
