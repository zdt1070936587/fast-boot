spring:
    datasource:
        username: ${POSTGRES_USER}
        password: ${POSTGRES_PASSWORD}
    data:
        redis:
            password: ${REDIS_PASSWORD:}

management:
    endpoints:
        web:
            exposure:
                include: health,info
    endpoint:
        health:
            show-details: always

springdoc:
    api-docs:
        enabled: true
    swagger-ui:
        enabled: true

fastboot:
    security:
        permit-docs: true
    admin:
        bootstrap: false
