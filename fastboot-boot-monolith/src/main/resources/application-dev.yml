spring:
  datasource:
    username: ${POSTGRES_USER:dafu}
    password: ${POSTGRES_PASSWORD:123456}
  data:
    redis:
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

fastboot:
  security:
    permit-docs: true
  admin:
    bootstrap: false
